<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 340px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 15px;
        margin: 0;
        background: #f8f9fa;
        color: #333;
      }
      h3 {
        margin-top: 0;
        color: #007bff;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .badge {
        font-size: 10px;
        background: #007bff;
        color: white;
        padding: 3px 6px;
        border-radius: 10px;
      }
      textarea {
        width: 100%;
        height: 120px;
        margin-bottom: 12px;
        box-sizing: border-box;
        border: 1px solid #ced4da;
        border-radius: 4px;
        padding: 8px;
        resize: vertical;
      }
      .control-group {
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      label {
        font-size: 13px;
        font-weight: 600;
      }
      select,
      input[type="range"] {
        width: 60%;
      }
      .stats {
        font-size: 11px;
        color: #6c757d;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      button {
        flex: 1;
        padding: 10px;
        font-size: 13px;
        font-weight: bold;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.2s;
      }
      #startBtn {
        background-color: #28a745;
      }
      #startBtn:hover {
        background-color: #218838;
      }
      #pauseBtn {
        background-color: #ffc107;
        color: #212529;
        display: none;
      }
      #pauseBtn:hover {
        background-color: #e0a800;
      }
      #stopBtn {
        background-color: #dc3545;
        display: none;
      }
      #stopBtn:hover {
        background-color: #c82333;
      }
      .instructions {
        font-size: 11px;
        color: #6c757d;
        background: #e9ecef;
        padding: 8px;
        border-radius: 4px;
        border-left: 3px solid #007bff;
        margin: 0;
      }
      #messageText {
        display: none;
        font-size: 11px;
        color: #842029;
        background: #f8d7da;
        border: 1px solid #f1aeb5;
        padding: 8px;
        border-radius: 4px;
        margin: 0 0 10px;
      }
    </style>
  </head>
  <body>
    <h3>Human Typer Pro <span class="badge">v2.0</span></h3>

    <textarea id="essay" placeholder="Paste your essay here..."></textarea>

    <div class="control-group">
      <label for="speed">Target Speed:</label>
      <select id="speed">
        <option value="40">40 WPM (Relaxed/Average)</option>
        <option value="65" selected>65 WPM (Fast Human)</option>
        <option value="90">90 WPM (Professional)</option>
        <option value="120">120 WPM (World Class)</option>
        <option value="custom">Custom WPM</option>
      </select>
    </div>

    <div class="control-group" id="customSpeedGroup" hidden>
      <label for="customSpeed">Custom WPM:</label>
      <input id="customSpeed" type="number" min="1" max="1000" step="1" value="65" />
    </div>

    <div class="control-group">
      <label for="timingMode">Timing:</label>
      <select id="timingMode">
        <option value="speed" selected>Use WPM speed</option>
        <option value="duration">Finish within custom time</option>
      </select>
    </div>

    <div class="control-group" id="durationGroup" hidden>
      <label for="duration">Time (seconds):</label>
      <input id="duration" type="number" min="1" step="1" value="60" />
    </div>

    <div class="control-group">
      <label for="humanMode">Human Realism:</label>
      <select id="humanMode">
        <option value="high">High (Variable Delays + Typos)</option>
        <option value="medium">Medium (Variable Delays Only)</option>
        <option value="none">None (Perfect Robot Cadence)</option>
      </select>
    </div>

    <div class="stats">
      <span id="charCount">Characters: 0</span>
      <span id="statusText">Status: Ready</span>
    </div>
    <div class="stats">
      <span id="progressText">Progress: 0%</span>
      <span id="timeText">Remaining: --</span>
    </div>
    <div class="stats">
      <span id="currentSpeedText">Current: -- WPM</span>
    </div>
    <div id="messageText" role="status" aria-live="polite"></div>

    <div class="btn-row">
      <button id="startBtn">▶ Start Auto-Type</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="stopBtn">⏹ Stop</button>
    </div>

    <p class="instructions">
      <strong>To execute:</strong> Click Start, then instantly click inside the
      competition's text area within 3 seconds.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
